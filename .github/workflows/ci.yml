name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Needs no system libraries: xtask only reads Cargo.toml files.
  fmt:
    name: Format and dependency rules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo xtask check-deps

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libraw-dev liblcms2-dev libgexiv2-dev libclang-dev clang pkg-config \
            libxkbcommon-dev libwayland-dev libvulkan-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # The app crate has no tests and pulls in eframe/winit (~150 crates), so the
  # test job skips it (clippy still covers it), along with the display
  # libraries it links.
  test:
    name: Test
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libraw-dev liblcms2-dev libgexiv2-dev libclang-dev clang pkg-config \
            libvulkan-dev mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The GPU tests skip themselves when no Vulkan adapter is available;
      # lavapipe (mesa-vulkan-drivers) provides a software one here.
      - run: cargo test --workspace --exclude viberoom-app

  deny:
    name: Licenses and advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
