name: Release

# Push a tag like v0.1.0 to build every Linux package and publish a GitHub
# release. Run it manually (workflow_dispatch) to dry-run the builds; the
# publish step only runs for tags.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Fail fast if the tag and the packaging files disagree about the version.
  check:
    name: Check version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"; exit 1
          fi
          grep -q "^pkgver=$version\$" packaging/PKGBUILD \
            || { echo "::error::packaging/PKGBUILD pkgver != $version"; exit 1; }
          grep -q "^Version:[[:space:]]*$version\$" packaging/viberoom.spec \
            || { echo "::error::packaging/viberoom.spec Version != $version"; exit 1; }

  # Stable source tarball (GitHub's auto-generated archives can change
  # checksum); the Arch and RPM builds consume it.
  source:
    name: Source tarball
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Archive
        run: |
          v=${{ needs.check.outputs.version }}
          git archive --format=tar.gz --prefix="viberoom-$v/" -o "viberoom-$v.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: viberoom-*.tar.gz

  # Debian packages link against the distro's own libraw soname, so they are
  # built once per supported release instead of once for all.
  deb:
    name: .deb (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libraw-dev liblcms2-dev libgexiv2-dev libclang-dev clang pkg-config \
            libxkbcommon-dev libwayland-dev libvulkan-dev dpkg-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - run: cargo install cargo-deb --locked
      - run: cargo build --release --locked -p viberoom-app -p viberoom-cli
      - name: Package
        run: |
          cargo deb -p viberoom-app --no-build --output dist/
          cd dist
          for f in *.deb; do
            mv "$f" "${f%.deb}_${{ matrix.os }}.deb"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.os }}
          path: dist/*.deb

  rpm:
    name: .rpm (Fedora)
    needs: [check, source]
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source
      - name: Install build tools
        run: |
          dnf install -y rpm-build cargo rust gcc clang clang-devel pkgconf-pkg-config \
            LibRaw-devel lcms2-devel 'pkgconfig(gexiv2)'
      - uses: actions/checkout@v4
        with:
          path: repo
      - name: Build
        run: |
          mkdir -p ~/rpmbuild/SOURCES
          cp viberoom-*.tar.gz ~/rpmbuild/SOURCES/
          rpmbuild -bb repo/packaging/viberoom.spec
          mkdir dist && cp ~/rpmbuild/RPMS/*/*.rpm dist/
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm

  arch:
    name: Arch package
    needs: [check, source]
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source
      - uses: actions/checkout@v4
        with:
          path: repo
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed rust clang libraw lcms2 libgexiv2 vulkan-icd-loader libxkbcommon wayland git
      - name: makepkg
        run: |
          # makepkg refuses to run as root.
          useradd -m builder
          v=${{ needs.check.outputs.version }}
          mkdir /home/builder/pkg
          cp viberoom-$v.tar.gz /home/builder/pkg/
          # Build from the local tarball instead of the (not yet published) tag.
          sed -e 's|^source=.*|source=("$pkgname-$pkgver.tar.gz")|' \
              repo/packaging/PKGBUILD > /home/builder/pkg/PKGBUILD
          chown -R builder /home/builder/pkg
          # CI already ran the tests; skip check() to keep the release fast.
          su builder -c 'cd ~/pkg && makepkg --nocheck --noconfirm'
          mkdir dist && cp /home/builder/pkg/*.pkg.tar.zst dist/
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: dist/*.pkg.tar.zst

  # Portable build that bundles libraw, lcms2 and gexiv2. Built on the oldest
  # runner for the widest glibc compatibility. The Vulkan loader, display
  # libraries and GPU drivers always come from the host.
  appimage:
    name: AppImage
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libraw-dev liblcms2-dev libgexiv2-dev libclang-dev clang pkg-config \
            libxkbcommon-dev libwayland-dev libvulkan-dev file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p viberoom-app -p viberoom-cli
      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          VERSION: ${{ needs.check.outputs.version }}
          LINUXDEPLOY_OUTPUT_VERSION: ${{ needs.check.outputs.version }}
        run: |
          base=https://github.com/linuxdeploy
          curl -fsSLO $base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSLO $base/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x linuxdeploy-*.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable target/release/viberoom \
            --executable target/release/viberoom-cli \
            --desktop-file packaging/viberoom.desktop \
            --icon-file assets/viberoom.svg \
            --output appimage
          mkdir dist
          mv Viberoom-*.AppImage "dist/viberoom-$VERSION-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, source, deb, rpm, arch, appimage]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          # Tags like v0.2.0-rc1 are marked as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
