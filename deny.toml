# cargo-deny config (plan §13: "Checks on every change"). Run with
# `cargo deny check` (needs `cargo install cargo-deny`).

[graph]
targets = []

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Compatible with GPL-3.0-or-later (plan D2/§3): permissive licenses, plus
# the copyleft licenses our own system dependencies actually use.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "GPL-3.0-or-later",
    "GPL-2.0-or-later",
    "LGPL-2.1-or-later",
    "LGPL-2.1-only",
    "CDDL-1.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
