# cargo-deny config (plan §13: "Checks on every change"). Run with
# `cargo deny check` (needs `cargo install cargo-deny`).

[graph]
targets = []

[advisories]
version = 2
yanked = "deny"
# Transitive advisories with no fix available without bumping egui/wgpu;
# revisit when those bump their dependencies.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste: via wgpu-hal's macOS-only metal backend" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: via egui's ab_glyph, no replacement yet" },
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.38 via zbus_xml (egui accessibility); only parses local D-Bus introspection XML, fix needs an eframe bump" },
    { id = "RUSTSEC-2026-0195", reason = "same as RUSTSEC-2026-0194" },
]

[licenses]
version = 2
# Compatible with GPL-3.0-or-later (plan D2/§3): permissive licenses, plus
# the copyleft licenses our own system dependencies actually use.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "IJG",              # jpeg-encoder
    "OFL-1.1",          # egui's bundled default fonts
    "Ubuntu-font-1.0",  # egui's bundled default fonts
    "MPL-2.0",
    "GPL-3.0-or-later",
    "GPL-2.0-or-later",
    "LGPL-2.1-or-later",
    "LGPL-2.1-only",
    "CDDL-1.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
