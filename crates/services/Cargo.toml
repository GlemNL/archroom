[package]
name = "viberoom-services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
viberoom-core = { workspace = true }
viberoom-catalog = { workspace = true }
viberoom-io = { workspace = true }
viberoom-engine = { workspace = true }
viberoom-color = { workspace = true }
crossbeam-channel = { workspace = true }
viberoom-preview = { workspace = true }
viberoom-jobs = { workspace = true }
rusqlite = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
walkdir = "2"
open = "5"
trash = "5"
tiff = "0.10"
jpeg-encoder = { version = "0.6", features = ["simd"] }
image = { version = "0.25", default-features = false, features = ["png"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
tempfile = "3"
rexiv2 = "0.10"
