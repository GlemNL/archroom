[package]
name = "viberoom-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "viberoom-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
viberoom-core = { workspace = true }
viberoom-catalog = { workspace = true }
viberoom-services = { workspace = true }
viberoom-engine = { workspace = true }
viberoom-color = { workspace = true }
viberoom-io = { workspace = true }
serde_json = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
clap = { version = "4", features = ["derive"] }
anyhow = { workspace = true }
tracing = { workspace = true }

# viberoom-preview joins once `export` (M5) is implemented.
