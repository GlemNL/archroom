[package]
name = "archroom-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "archroom-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
archroom-core = { workspace = true }
archroom-catalog = { workspace = true }
archroom-services = { workspace = true }
